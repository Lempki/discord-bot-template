# Runs the bot alone. Use compose.stack.yml to also run the api-* services it depends on.
# Docker keeps at most two log files of 5 MB per container and overwrites the oldest.
# Without a limit, a log grows until the container is recreated.
x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

# Each container may use at most its mem_limit, which is several times its normal use.
# A container that leaks past it is restarted alone, instead of slowing the whole computer.

services:
  bot:
    build: .
    env_file:
      - .env
    volumes:
      - bot-data:/app/data
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m

volumes:
  bot-data:
