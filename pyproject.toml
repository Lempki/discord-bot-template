[project]
name = "discord-bot-template"
version = "1.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "A modular discord.py bot template with cogs, per-guild settings, and locale-aware messages."
requires-python = ">=3.12"
dependencies = [
    # The voice extra installs PyNaCl and davey, the DAVE end-to-end encryption library.
    # Discord has required DAVE for every voice connection since March 2026.
    "discord.py[voice]>=2.7.1,<3.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.2.2",
    "aiosqlite>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.uv]
# The bot is an application run from its directory, not an installable package.
package = false
# discord.py 2.7.1 caps PyNaCl below 1.6, but PyNaCl 1.6.2 fixes GHSA-mrfv-m5wm-5w6w in libsodium.
# discord.py's main branch already allows PyNaCl 1.6.x. Remove this override once a release does.
override-dependencies = ["pynacl>=1.6.2,<1.7"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
