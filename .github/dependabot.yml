version: 2
# Monthly, because each update runs CI on its pull request and again on main, which costs minutes.
# Security updates do not wait for this schedule.
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # A new Python also needs a new .python-version and lint target, so it is moved by hand.
    ignore:
      - dependency-name: python
        update-types: ["version-update:semver-minor"]
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      hooks:
        patterns: ["*"]
