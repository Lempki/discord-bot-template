# Runs the bot together with the api-* services it uses, built from the sibling repository folders.
# Clone api-media next to this repository, then run: docker compose -f compose.stack.yml up --build
# The services share a private network, so their ports are not published to the host.

services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      # Inside the stack the bot reaches the service by its compose name instead of localhost.
      API_MEDIA_URL: http://media:8000
    volumes:
      - bot-data:/app/data
    depends_on:
      media:
        condition: service_healthy
    restart: unless-stopped

  media:
    build: ../api-media
    env_file:
      # Optional settings such as Spotify credentials. The file may be absent.
      - path: ../api-media/.env
        required: false
    environment:
      # One secret, read from this repository's .env, so the bot and the service always agree.
      API_SECRET: ${API_MEDIA_SECRET:?Set API_MEDIA_SECRET in .env}
    volumes:
      # An optional YouTube cookies file. YDL_COOKIES_FILE in ../api-media/.env names it.
      - ../api-media/cookies:/app/cookies:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  bot-data:
