# Runs the bot together with the discord-api-* services it uses, built from the sibling repository folders.
# Clone discord-api-media next to this repository, then run: docker compose -f compose.stack.yml up --build
# The services share a private network, so their ports are not published to the host.

services:
  bot:
    build: .
    env_file:
      - .env
    environment:
      # Inside the stack the bot reaches the service by its compose name instead of localhost.
      DISCORD_API_MEDIA_URL: http://media:8000
    volumes:
      - bot-data:/app/data
    depends_on:
      media:
        condition: service_healthy
    restart: unless-stopped

  media:
    build: ../discord-api-media
    env_file:
      # Optional settings such as Spotify credentials. The file may be absent.
      - path: ../discord-api-media/.env
        required: false
    environment:
      # One secret, read from this repository's .env, so the bot and the service always agree.
      DISCORD_API_SECRET: ${DISCORD_API_MEDIA_SECRET:?Set DISCORD_API_MEDIA_SECRET in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  bot-data:
